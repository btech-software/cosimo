[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosimo"
version = "0.1.0"
description = "Reasoning Language Model Post-Trained with Financial Domain Synthetic Dataset"
readme = "README.md"
authors = [{ name = "Cosimo Team", email = "cosimo@btech.software" }]
requires-python = ">=3.12"
dependencies = [
    "btech-agent-lab>=1.12.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cosimo"]

[dependency-groups]
# Corpus control plane (dataset/pipelines/v3): the ETL needs a YAML reader for
# taxonomy/work_types.yaml and nothing else beyond the stdlib. Deliberately
# separate from fine-tune: the generation box is CPU-only and must never drag
# torch onto a Spark node's image (spec §9).
corpus = [
    "pyyaml>=6.0",
]
# Post-training stack for jobs/fine-tune, executed on an NVIDIA DGX Spark
# (GB10 Grace Blackwell, aarch64, CUDA 13). torch is intentionally absent: it is
# provided by the NGC base image (docker/fine-tune/Dockerfile) and must not be
# replaced by a PyPI build. unsloth/unsloth_zoo are installed with --no-deps in
# that Dockerfile because their metadata pins conflict with the NGC-tuned stack.
# Version bounds are dictated by unsloth 2026.9.4: trl<=0.24.0, datasets<4.4.0,
# peft>=0.18.0, bitsandbytes!=0.46.0,!=0.48.0 -- the same bounds 2026.8.1
# declared on everything except transformers.
#
# transformers 5.x, not 4.x, and that is forced by the student rather than
# chosen: Qwen/Qwen3.8-27B is `model_type: qwen3_5`, and the qwen3_5
# implementation first ships in transformers 5.2.0 -- it is absent from 4.56.2,
# from the 4.x tail (4.57.6) and even from 5.0.0. unsloth 2026.9.4 accepts
# >=4.51.3,<=5.5.0, so 5.5.0 is the top of the usable window. Verified on the
# DGX Spark against the NGC torch 2.10.0a0 build: imports clean, FA2 available,
# bf16 true, and the 4-bit 27B loads.
#
# The 4->5 jump is not free. `group_by_length` is accepted and silently ignored
# (04_train_sft.py translates it), and `warmup_ratio` and `logging_dir` warn as
# deprecated while still working -- see the note in configs/sft.yaml.
fine-tune = [
    "transformers==5.5.0",
    "trl==0.24.0",
    "peft==0.20.0",
    "datasets==4.3.0",
    "accelerate==1.14.0",
    "bitsandbytes==0.49.2 ; sys_platform == 'linux'",
    # 1.x, not 0.x: transformers 5.5.0 declares huggingface-hub>=1.5.0,<2.0, and the old
    # <1.0 ceiling against it is unresolvable (the image build fails with
    # ResolutionImpossible). scripts/00_check_env.py cross-checks this same range.
    # hf-transfer is gone rather than bumped: hub 1.x does not use it -- it ships hf-xet
    # transitively instead, and HF_HUB_ENABLE_HF_TRANSFER now only prints a deprecation
    # warning on every run (see HF_XET_HIGH_PERFORMANCE in docker/fine-tune/Dockerfile).
    "huggingface-hub>=1.5.0,<2.0",
    "sentencepiece>=0.2.0",
    "tensorboard==2.21.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]
dev = [
    "pre-commit~=4.6.0",
    "ruff~=0.15.10",
]
test = [
    "pytest~=9.0.3",
    "testcontainers[postgres]~=4.14.2",
    "testcontainers[redis]~=4.14.2",
    "testcontainers[vault]~=4.14.2",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203", "E501"]
