seed: 3407
model:
  # The v3 student (spec §8.1, decision log #5). Phi-4 support was dropped
  # (decision log #7): no v2 model was ever pushed, so the archived build
  # contract guarded nothing, and a 3.8B student cannot reach the analytical
  # standard this corpus is built for.
  base_id: Qwen/Qwen3.8-27B
  revision: null            # pin a commit sha to make training AND evaluation reproducible
  # 8192 on Spark to start; 16384 later. The served target is a LangGraph ReAct
  # loop, where the conversation accumulates assistant tool calls and tool
  # results turn after turn on top of the persona, so the trained window has to
  # hold more than one round-trip. Raising it costs activation memory and step
  # time on every stage.
  max_seq_length: 8192
  # QLoRA, unlike the Phi run's bf16 LoRA: 27B parameters at bf16 do not leave
  # room for an 8k sequence and its activations inside 128 GB of unified memory.
  # This is the knob to revisit first if the LoRA smoke is memory-bound.
  load_in_4bit: true

  # Take `base_id` literally instead of letting unsloth swap in its own
  # pre-quantized mirror. With load_in_4bit and this left false, unsloth
  # rewrites Qwen/Qwen3.8-27B to unsloth/Qwen3.8-27B-unsloth-bnb-4bit -- and
  # that checkpoint's quantization state does not survive loading here: all 352
  # quantizable linears arrive with no quant_state ("Skipping ...: no
  # quant_state found"), so the first forward pass hands a packed 4-bit tensor
  # to F.linear and dies on the shape. Measured on unsloth 2026.9.4 /
  # unsloth_zoo 2026.9.3 (both the newest releases) against bitsandbytes 0.49.2
  # and 0.50.2 alike, in a file unsloth itself files under `temporary_patches`.
  #
  # True means the bf16 weights are fetched and bitsandbytes quantizes them at
  # load time -- the classic QLoRA path, which builds the quant_state instead of
  # trying to recover one. It costs a 55.6 GB download rather than 22.4 GB.
  #
  # It must be the same for training and inference: an adapter fitted to one set
  # of base weights does not belong on the other, and the swap is silent.
  use_exact_model_name: true
  dtype: bfloat16
dataset:
  # The v3 corpus: eight record types keyed on work_type / scenario family
  # rather than v2's program / stem family. Published as a new Hub repo rather
  # than a config split on v2 (decision log #2).
  hub_id: btech-software/cosimo-quant-assistant-v3
  revision: main

  # Which Hub config carries the preference pairs, or null for none. v3 puts
  # its pairs in the `cosimov3pref_` id space, disjoint from every supervised
  # `cosimov3_` id, so the SFT/DPO chosen-side overlap that made run 1's
  # preference stage a zero-gradient no-op cannot recur.
  preference_config: preference

  # Read the corpus off a local v3 shard tree instead of the Hub. Point it at
  # a `COSIMO_V3_OUT` directory -- the one holding `sft/*.jsonl` and
  # `preference/pairs.jsonl` -- and `hub_id` is ignored:
  #
  #   ./scripts/01_prepare_data.py --set dataset.local_dir=/path/to/shards/v3
  #
  # This is how the corpus is consumed until the v3 Hub repo exists: v3's
  # `publish` command certifies the board and writes a dataset card, but does
  # not push (dataset/pipelines/v3/publish.py), so there is nothing for
  # `load_dataset` to read yet. It is also the only way to prepare data on a
  # box with no network. Set back to null once the repo is pushed and pinned.
  local_dir: null

  # No v1 mix. The 12% cap was a crutch for a corpus whose exam slice was the
  # only deep one; v3 supplies its own exam records under an inventory family
  # cap, and re-adding v1 would reintroduce the collapse the cap fought
  # (spec §2, §12).
  mix: []
paths:
  data_dir: data
  processed_dir: data/processed
  runs_dir: runs
prompt:
  # The persona. Present on EVERY example, training and inference. The end goal
  # is a financial domain assistant, not an exam-passer: the identity is bound
  # on every example so exam traces cannot become the model's whole notion of
  # "being Cosimo".
  #
  # Shortened for v3 (spec §8.1). The Phi-4 run's block was 2,494 characters --
  # ~600-630 tokens on every example, training and eval -- and length was not
  # buying behaviour: the served checkpoint still answered an open-ended
  # question in exam form. What it did buy was a large fixed prefix that DPO's
  # keep_end truncation cuts from the START, and a persona so specific that the
  # model had to be brittle to it. Every clause below is load-bearing: ranges
  # over false precision, no invented prints, tools for retrieval, and exam
  # liturgy kept in its lane.
  identity: |-
    You are Cosimo, a quantitative finance assistant at Btech Software.
    Prefer ranges when the inputs do not identify a point. Do not invent
    prints, filings, or tickers. Use tools when a number must be retrieved
    or computed. Never use exam liturgy unless the user asked an exam item.

  # One-line identity, used on a `variation_rate` fraction of TRAINING examples
  # so the model does not become brittle to one exact string. Never used at eval.
  identity_short: "You are Cosimo, a quantitative finance assistant at Btech Software."

  # Task block appended ONLY for exam-format items (Cosimo exam records, GSM8K,
  # MATH-500). It carries the grading contract, so the base model is told the
  # same thing the tuned model was trained on and the comparison stays fair.
  #
  # The closing line changed with v3. Its exam renderer composes four labelled
  # options and closes on `FINAL ANSWER: <letter> -- <value> <unit>`
  # (dataset/pipelines/v3/render/exam.py), so instructing the v2 `<value>` form
  # here would tell the model to produce something every supervised target
  # contradicts. GSM8K and MATH-500 have no options; a bare value still
  # satisfies `grading.grade_cosimo`, which reads a letter when one is there
  # and a number otherwise.
  exam_protocol: >-
    Solve the problem step by step: state your assumptions, show the formulas you use,
    and compute carefully. Choose one of the options offered. Finish with a single
    final line in exactly this form:

    FINAL ANSWER: <letter> -- <value> <unit>

  # Fraction of TRAINING examples that use identity_short, selected by hashing the
  # record id so data preparation stays reproducible.
  variation_rate: 0.15

  # The marker the grader looks for on the final line.
  final_answer_tag: "FINAL ANSWER:"
tools:
  # Synthetic tool-calling data, written by scripts/02_prepare_tool_data.py and
  # mixed into sft_train.jsonl / sft_val.jsonl.
  #
  # The corpus itself contains no tool-call examples, and the application's own
  # tool surface (cosimo/mcp/tools.py) is still a placeholder, so there is nothing
  # real to train against. These rows therefore teach the *format*, not a fixed
  # tool set: the conditional rule "given <|tool|> schemas in the system turn,
  # emit a <tool_call> naming one of them". Generalisation to the tools the app
  # eventually ships comes from schema variety here, not from schema identity.
  enabled: true

  # Reduced from 5000 now that v2 supplies 19,503 real agentic records. What
  # those records do NOT teach is declining to call: every one of them calls a
  # tool, and 18,912 of them offer a single schema. These synthetic rows are
  # kept for the two things the corpus lacks -- the tools.no_call_rate group and
  # 2-5 competing schemas per example -- not for volume.
  train_records: 2000
  val_records: 100

  # Schemas presented per example, sampled inclusively. More than one is
  # essential: with a single schema the model learns "call the tool" rather than
  # "choose the right tool", and never learns to decline when none fit.
  schemas_per_example: [2, 5]

  # Fraction of examples where no tool fits the question and the correct
  # behaviour is to answer directly. Without these the model calls a tool for
  # every question it is ever asked, including "what is a bond?".
  no_call_rate: 0.2

chat:
  # ChatML, the Qwen3.8 turn format. Set to null to fall back to the
  # tokenizer's own template (logged loudly) -- which is not what the base model
  # was compared against, so comparability goes with it.
  template_path: configs/chat_template.jinja
  # The markers train_on_responses_only masks on. They include the trailing
  # newline because ChatML puts the role on its own line: `<|im_start|>user` on
  # its own would also match the literal text of a discussion *about* the
  # format, and the masking check in 04_train_sft.py compares token ids.
  # Tool results render as `<|im_start|>user` turns so the same rule masks them.
  instruction_part: "<|im_start|>user\n"
  response_part: "<|im_start|>assistant\n"
