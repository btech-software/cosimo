# The cheap experiment: a few hundred v3 student rows, one epoch, no DPO.
#
# Layered on top of configs/sft.yaml (`--config configs/sft_smoke.yaml`). It
# exists so a smoke run is a *named* thing rather than a pile of --set flags
# that nobody can reproduce, and so the row-count guard has a ceiling to
# enforce: the whole point of this stage is to see the student fail on a
# handful of rows before any teacher tokens are spent on more of them.
#
# What it deliberately does NOT change: learning rate, LoRA rank, batch shape.
# A smoke that trains differently from the real run measures the smoke.
sft:
  run_name: sft_smoke

  # The cap the reviewer asked for. 200 rows is enough for the optimizer to
  # move and small enough that an epoch is minutes; the guard refuses anything
  # larger rather than quietly running for hours.
  max_train_rows: 300
  min_train_rows: 8

  # Cadence follows the step count (configs/sft.yaml), which on a run this
  # short means evaluating every step or two -- which is what you want when
  # the question is "did this move at all".
  eval_steps: auto
  save_steps: auto
  save_total_limit: 2

data:
  # Belt and braces with the ceiling above: 01_prepare_data subsamples to this
  # before the trainer ever sees the file, and the subsample is seeded.
  max_train_records: 200

  # 0.01 (configs/data.yaml) is a fraction sized for the full corpus. On a
  # smoke-sized pool it rounds to zero rows and `01_prepare_data` refuses --
  # "the 'val' split is empty for a pool of N records" -- so the smoke needs
  # its own fraction rather than a --set at the call site. 0.1 of a ~50-row
  # train pool is a handful of rows: enough for the eval cadence above to have
  # something to score, and the point of this stage is the loss curve moving at
  # all, not a tight validation estimate.
  val_frac: 0.1

dataset:
  # No DPO in this stage, and `configs/base.yaml` declares `preference_config:
  # preference` for the full run -- which makes `01_prepare_data` treat empty
  # pair files as *lost* pairs rather than absent ones, and fail. A v3 tree that
  # has not reached the `prefer` stage has nothing to lose, so the smoke says so
  # explicitly instead of being read as a broken preference run.
  preference_config: null

tools:
  # Off for the smoke, and this is a ratio decision rather than a view about
  # tool-calling. `02_prepare_tool_data.py` floors its synthetic rows at
  # MIN_TRAIN_ROWS = 120 so that a small tree still samples schema variety; but
  # against a ~50-row corpus that floor *is* the corpus -- measured at 72% of
  # the supervised signal, which is the same crowding-out its own docstring
  # records from the 2000-row constant era (48%, and a model that answered a
  # multiple-choice question with a calculator call).
  #
  # The suites this stage is judged on are prose: `traps.jsonl` is TCA
  # shortfall and Brinson reconciliation, and contains no tool call at all. So
  # the drills cannot show up in the result, only in what they displaced, and a
  # flat trap score would be unattributable. Turn this back on when the mix is
  # large enough that 12% of it is 12% of it.
  enabled: false
