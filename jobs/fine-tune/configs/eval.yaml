# Evaluation defaults, layered on top of configs/base.yaml.
# Used by scripts/03_baseline_eval.py and scripts/06_evaluate.py; every run
# records the resolved config, so changing anything here changes the config
# hash stored in metrics.json.
eval:
  # Suites evaluated when --suites is not given. The two cosimo suites are read
  # from data/processed/ (produced by 01_prepare_data.py); gsm8k and math500 are
  # downloaded from the Hub and exist to detect general-reasoning regression,
  # not finance skill.
  suites:
    - cosimo_test          # held-out IID slice: the headline in-domain number
    - cosimo_unseen_stems  # stem families excluded from all training: generalisation
    - gsm8k                # grade-school math regression check
    - math500              # competition math regression check

  # Items per suite. null = evaluate every item in the suite. The math suites are
  # subsampled because 250 items is enough to detect a meaningful regression and
  # keeps a full evaluation to a sane wall clock. Subsampling is deterministic
  # (seeded by the top-level `seed`), so every run scores the same items.
  # cosimo_unseen_stems is sampled by default: the six held-out stem families are
  # ~8.5% of 71k, i.e. ~6,000 items, which would dominate every evaluation (hours
  # per model, multiplied by baseline/SFT/DPO). 1000 items is ample for the
  # generalisation read; set it to null for a final, full-slice number.
  samples:
    cosimo_test: null
    cosimo_unseen_stems: 1000
    gsm8k: 250
    math500: 250

  # Decoding budget per item. 2048, NOT the 768 this started at: the base model
  # is a long chain-of-thought reasoner that routinely spends well over a
  # thousand tokens thinking before it answers, and 768 cut it off mid-sentence
  # on 90-97% of items in the first full run:
  #
  #   baseline truncation_rate @768 -- cosimo_test 0.895, unseen_stems 0.929,
  #                                    gsm8k 0.524, math500 0.968
  #
  # Those generations were graded wrong for running out of budget, not for being
  # wrong -- one math500 item had already produced the correct value and closed
  # its </think> block when the cap hit. That understates the baseline, and every
  # base-vs-tuned delta measured against it is inflated by the difference.
  #
  # It is NOT 4096, which was tried and killed the machine: at a fixed
  # batch_size of 16 that reserved 16 x (575 + 4096) = 74 736 token slots of KV
  # cache, exhausted all 121 GB of unified memory, and was OOM-killed along with
  # the desktop session. max_batch_tokens below now bounds that product, so this
  # value is safe to raise -- it costs wall clock (smaller batches), not
  # stability. Raise it if truncation_rate is still high and you can afford the
  # time; summarize_suite() warns above 10%.
  max_new_tokens: 2048

  # Hard cap on `sequences x (longest_prompt + max_new_tokens)` per forward pass.
  # batch_size alone does not bound memory -- this does. Derived from the run
  # that completed: 16 x (575 + 768) = 21 488 slots. 24 576 keeps ~14% headroom
  # over that known-good point and is far below the 74 736 that died.
  #
  # Why it matters more here than on a discrete GPU: unified memory is shared
  # with the host and the driver's reservations are unswappable, so overshooting
  # is not a catchable torch.cuda.OutOfMemoryError -- the kernel OOM-killer runs
  # and takes unrelated processes with it. Raise only after measuring, and note
  # that prompt lengths come from split_manifest.json (p95 552, max 575 today).
  # null disables the cap and restores pure count-based batching.
  max_batch_tokens: 24576

  # 0.0 = greedy decoding (do_sample=False). Evaluation must be deterministic so
  # a base-vs-tuned delta is a model difference, not sampling noise.
  temperature: 0.0

  # Nucleus cutoff, only consulted when temperature > 0.
  top_p: 1.0

  # Prompts generated per forward pass. Prompts are bucketed by length before
  # batching, so this trades unified memory for throughput; lower it first on OOM.
  batch_size: 16

  # Relative tolerance for numeric answer matching (0.1%). Loose enough to accept
  # rounding differences in a multi-step calculation, tight enough that a wrong
  # intermediate step still fails.
  rel_tol: 1.0e-3
