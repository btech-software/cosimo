# Data preparation defaults, layered on top of configs/base.yaml.
# Used by scripts/01_prepare_data.py. The resolved config is hashed into
# data/processed/split_manifest.json, so changing anything here changes the
# recorded hash and the split assignment is traceable to it.
data:
  # Fraction of the non-held-out pool reserved for validation. 1% of ~65k rows
  # is ~650 examples: enough for a stable eval-loss curve, small enough that
  # mid-training evaluation costs minutes rather than hours.
  val_frac: 0.01

  # Fraction reserved for the IID test slice reported as the headline in-domain
  # accuracy. ~650 items is the target: a tolerable evaluation wall clock, and a
  # Wilson interval narrow enough to resolve the effect sizes we expect.
  #
  # Larger than val_frac because this fraction is taken from the *exam* records
  # alone -- the other seven record types have no final-answer value for the
  # grader to read, so they get test_frac 0 and never reach an eval slice.
  #
  # The premise behind the exact number changed with v3. Under the v2 mix exam
  # was ~30% of the corpus and 1.7% of it produced the ~650-item headline
  # slice. v3 caps exam at 12-18% of the corpus (spec §6 axis 8) and drops the
  # v1 mix, so the same fraction of a much smaller exam pool yields far fewer
  # items. Left at 0.017 rather than guessed upward: the right value follows
  # from the first real corpus size (PR6), and raising it now would trade
  # training data for an interval nobody has measured. Revisit once the
  # published row count is known.
  test_frac: 0.017

  # Cap on the number of SFT training rows written to sft_train.jsonl.
  # null = use every train-split record. Set it to shorten an epoch without
  # touching the split assignment; the subsample is seeded, so it is stable.
  # Preference rows are not capped by this — DPO reads its own pref_train.jsonl.
  # This is the knob to reach for when the wall clock is the problem. It bites
  # less than it did under Phi: the v3 identity block is ~70 tokens against the
  # v2 block's ~600-630, so a step no longer costs roughly twice a bare
  # instruction.
  max_train_records: null

  # Fraction of preference-carrying records RESERVED for the preference stage:
  # excluded from sft_train/sft_val and written to pref_train/pref_val instead.
  # Records not reserved stay in SFT and are dropped from the preference files.
  #
  # This exists because 0.0 -- the original behaviour -- makes DPO a no-op. The
  # corpus `reasoning_trace` IS the `chosen` side of the pair, so training SFT on
  # a row teaches the policy that exact trace. In the first full run all 22,048
  # preference rows were also SFT rows, and by the time DPO started the policy
  # already put overwhelming relative likelihood on chosen over rejected: the
  # implicit reward margin was hundreds of nats, the sigmoid saturated, the loss
  # was exactly 0.0 from step 10 and the gradient was zero. DPO cost ~5 h and
  # moved the adapter 0.16%.
  #
  # 0.5 splits the difference: SFT keeps ~83% of its corpus and DPO gets ~11k
  # pairs whose chosen trace the policy has never been trained on, so the margin
  # is not pre-saturated. Raise it toward 1.0 for a stronger preference stage at
  # the cost of supervised data; 0.0 restores the old (broken) behaviour.
  #
  # The draw is a salted hash of the record id, so it is reproducible and
  # deliberately uncorrelated with the prompt.variation_rate draw.
  preference_holdout_frac: 0.5

  # Scenario families excluded from train/val/test entirely; every one of their
  # records lands in the unseen_stems evaluation slice. Held out by *family*,
  # which in v3 means the full `scenario_id` -- `<work_type>.<family>` -- the
  # key every published row already carries. Entries are matched against that
  # string exactly; there are no v_/cr_/m_ wrapper stems in v3 to strip.
  #
  # Why these are shipped families rather than the ones work_types.yaml marks
  # `holdout: true`: the v3 renderers skip holdout families outright
  # (render/prose.py, exam.py, agentic.py, implementation.py all filter
  # `not job.holdout`), so `fade_required` and its four siblings have fact
  # packs on disk but no rendered rows anywhere in the published corpus. There
  # is nothing downstream to hold out. Until the corpus side renders them into
  # an eval slice, the generalisation measurement has to come from families
  # that are actually shipped.
  #
  # Two of the ten shipped families, ~20% of the corpus, spanning two work
  # types and two different fact computers. v1/v2 held out 8-9%, but with only
  # ten families a single entry would confine the whole generalisation claim to
  # one work type -- the single-topic artefact the v2 list was picked to avoid.
  # Drop to one entry if the training slice matters more than the breadth.
  holdout_scenario_families:
    - valuation.equity.dcf.cyclical_industrial   # valuation, valuation_fcff
    - risk.market.var_es.equity_longonly         # market risk, risk_var

  # The v1/v2 axis: stem families, stripped of their v_/cr_/m_ wrapper prefix.
  # Empty by default because v3 has no stem wrappers. configs/base.phi4.yaml
  # sets it to the six-family v2 list, and 01_prepare_data.py reads both keys,
  # so a v2 replay holds out exactly what it used to.
  holdout_families: []

  # Drop rows whose `verified` flag is false. These failed the generator's own
  # answer-recomputation check, so their answer and reasoning trace cannot be
  # trusted as a supervised target. The dropped count is logged and recorded in
  # split_manifest.json.
  drop_unverified: true
